<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex">
  <title>Sin conexión | Mineros TV</title>
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#19191B" media="(prefers-color-scheme: dark)">
  <script>try{var p=JSON.parse(localStorage.getItem("mineros_prefs")||"{}");if(p.theme==="light"||p.theme==="dark")document.documentElement.dataset.theme=p.theme;if(p.text==="grande"||p.text==="enorme")document.documentElement.dataset.text=p.text;}catch(e){}</script>
  <link rel="icon" href="/favicon.ico" sizes="any">

</head>

    <div class="intro" style="justify-items:center">
      <h1>Sin conexión</h1>
      <p>Esta página no está guardada en tu teléfono. Revisa tu señal o tu wifi y vuelve a intentar.</p>
    </div>
    <button class="boton boton-rojo" type="button" onclick="location.reload()">Volver a intentar</button>
    <a class="boton-texto" href="/">Ir a En vivo</a>

</html>
