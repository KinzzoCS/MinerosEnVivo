<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Chat | Panel Mineros TV</title>
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#19191B" media="(prefers-color-scheme: dark)">
  <script>try{var p=JSON.parse(localStorage.getItem("mineros_prefs")||"{}");if(p.theme==="light"||p.theme==="dark")document.documentElement.dataset.theme=p.theme;if(p.text==="grande"||p.text==="enorme")document.documentElement.dataset.text=p.text;}catch(e){}</script>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Big+Shoulders+Display:wght@600;800;900&family=Big+Shoulders+Stencil+Display:wght@800&display=swap">
  <link rel="stylesheet" href="../assets/css/main.css?v=20261103d">
  <link rel="stylesheet" href="../assets/css/admin.css?v=20261103d">
</head>
<body class="cargando">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div class="panel">
    <header class="panel-cabeza">
      <a class="marca" href="dashboard.html"><img src="../assets/icons/escudo.png" alt="" width="48" height="34">Panel<span>MTV</span></a>
      <span class="panel-usuario" data-admin-email></span>
      <button class="boton-ajustes" type="button" data-abrir-ajustes aria-label="Ajustes de letra y color">Aa</button>
      <button class="boton boton-borde boton-chico" type="button" data-logout>Salir</button>
    </header>
    <nav class="panel-nav" data-admin-nav aria-label="Secciones del panel"></nav>
    <main class="panel-main" id="contenido">
      <div class="panel-titulo">
        <h1>Chat</h1>
        <p>Oculta mensajes, silencia usuarios por 30 minutos y bloquea palabras.</p>
      </div>
      <section class="formulario tarjeta" aria-labelledby="t-mensajes">
        <h2 id="t-mensajes">Mensajes</h2>
        <div class="selector selector-transmision" id="streamFilter" role="group" aria-label="Filtrar por transmisión">
          <button type="button" data-stream-filter="all" aria-pressed="true">Todas</button>
        </div>
        <div class="acciones-form">
          <button class="boton boton-peligro boton-chico" type="button" id="clearChat">Ocultar todos los visibles</button>
          <p class="aviso" id="chatNote" role="status" aria-live="polite"></p>
        </div>
        <div class="lista" id="messagesList"></div>
      </section>
      <form class="formulario tarjeta" id="wordForm">
        <h2>Palabras prohibidas</h2>
        <label class="campo" for="word">Palabra<input id="word" maxlength="50" required></label>
        <div class="acciones-form">
          <button class="boton boton-rojo" type="submit">Agregar palabra</button>
          <p class="aviso" id="wordNote" role="status" aria-live="polite"></p>
        </div>
        <div class="lista" id="wordsList"></div>
      </form>
    </main>
  </div>
  <script type="module" src="../assets/js/shell.js?v=20261103d"></script>
  <script type="module" src="../assets/js/admin/chat-admin.js?v=20261103d"></script>
</body>
</html>
