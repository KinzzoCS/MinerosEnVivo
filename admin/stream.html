<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Transmisiones | Panel Mineros TV</title>
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#19191B" media="(prefers-color-scheme: dark)">
  <script>try{var p=JSON.parse(localStorage.getItem("mineros_prefs")||"{}");if(p.theme==="light"||p.theme==="dark")document.documentElement.dataset.theme=p.theme;if(p.text==="grande"||p.text==="enorme")document.documentElement.dataset.text=p.text;}catch(e){}</script>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Big+Shoulders+Display:wght@600;800;900&family=Big+Shoulders+Stencil+Display:wght@800&display=swap">
  <link rel="stylesheet" href="../assets/css/main.css?v=20261103d">
  <link rel="stylesheet" href="../assets/css/admin.css?v=20261103d">
</head>
<body class="cargando">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div class="panel">
    <header class="panel-cabeza">
      <a class="marca" href="dashboard.html"><img src="../assets/icons/escudo.png" alt="" width="48" height="34">Panel<span>MTV</span></a>
      <span class="panel-usuario" data-admin-email></span>
      <button class="boton-ajustes" type="button" data-abrir-ajustes aria-label="Ajustes de letra y color">Aa</button>
      <button class="boton boton-borde boton-chico" type="button" data-logout>Salir</button>
    </header>
    <nav class="panel-nav" data-admin-nav aria-label="Secciones del panel"></nav>
    <main class="panel-main" id="contenido">
      <div class="panel-titulo">
        <h1>Transmisiones</h1>
        <p>Agrega todos los medios que transmitan en YouTube. En la app solo aparecen los que están en vivo.</p>
      </div>
      <form class="formulario tarjeta" id="streamForm">
        <h2>Transmisión</h2>
        <input type="hidden" id="streamDocId">
        <fieldset class="grupo" data-campo-deporte>
          <legend>Deporte</legend>
          <div class="opciones opciones-2"><label><input type="radio" name="sport" value="beisbol" checked><span>Béisbol</span></label><label><input type="radio" name="sport" value="basquetbol"><span>Básquetbol</span></label></div>
        </fieldset>
        <div class="campos">
          <label class="campo" for="streamName">Nombre del medio<input id="streamName" maxlength="60" required><small>Por ejemplo: Mineros TV o La Poderosa De Parral.</small></label>
          <label class="campo" for="streamOrder">Orden en la app<input id="streamOrder" type="number" inputmode="numeric" min="0" max="99" required><small>El número más bajo aparece primero.</small></label>
        </div>
        <label class="campo" for="streamTitle">Título<input id="streamTitle" maxlength="100"><small>Por ejemplo: Mineros vs Dorados, juego 2</small></label>
        <label class="campo" for="streamUrl">Enlace de YouTube<input id="streamUrl" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=…" required><small id="urlHint"></small></label>
        <label class="interruptor"><input type="checkbox" id="streamLive"><span>En vivo ahora<small>Solo las transmisiones en vivo aparecen en la app.</small></span></label>
        <div class="acciones-form">
          <button class="boton boton-rojo" type="submit" id="submitBtn">Agregar transmisión</button>
          <p class="aviso" id="formNote" role="status" aria-live="polite"></p>
        </div>
      </form>
      <section class="seccion" aria-labelledby="t-lista">
        <h2 id="t-lista">Medios de transmisión</h2>
        <div class="lista" id="streamsList"></div>
      </section>
    </main>
  </div>
  <script type="module" src="../assets/js/shell.js?v=20261103d"></script>
  <script type="module" src="../assets/js/admin/stream-admin.js?v=20261103d"></script>
</body>
</html>
