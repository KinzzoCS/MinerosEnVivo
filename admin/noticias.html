<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Noticias | Panel Mineros TV</title>
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#19191B" media="(prefers-color-scheme: dark)">
  <script>try{var p=JSON.parse(localStorage.getItem("mineros_prefs")||"{}");if(p.theme==="light"||p.theme==="dark")document.documentElement.dataset.theme=p.theme;if(p.text==="grande"||p.text==="enorme")document.documentElement.dataset.text=p.text;}catch(e){}</script>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Big+Shoulders+Display:wght@600;800;900&family=Big+Shoulders+Stencil+Display:wght@800&display=swap">
  <link rel="stylesheet" href="../assets/css/main.css?v=20261103d">
  <link rel="stylesheet" href="../assets/css/admin.css?v=20261103d">
</head>
<body class="cargando">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div class="panel">
    <header class="panel-cabeza">
      <a class="marca" href="dashboard.html"><img src="../assets/icons/escudo.png" alt="" width="48" height="34">Panel<span>MTV</span></a>
      <span class="panel-usuario" data-admin-email></span>
      <button class="boton-ajustes" type="button" data-abrir-ajustes aria-label="Ajustes de letra y color">Aa</button>
      <button class="boton boton-borde boton-chico" type="button" data-logout>Salir</button>
    </header>
    <nav class="panel-nav" data-admin-nav aria-label="Secciones del panel"></nav>
    <main class="panel-main" id="contenido">
      <div class="panel-titulo">
        <h1>Noticias</h1>
        <p>Las noticias destacadas aparecen en la pestaña En vivo.</p>
      </div>
      <form class="formulario tarjeta" id="newsForm">
        <input type="hidden" id="docId">
        <fieldset class="grupo" data-campo-deporte>
          <legend>Deportes</legend>
          <div class="opciones opciones-2"><label><input type="checkbox" id="sport-beisbol" checked><span>Béisbol</span></label><label><input type="checkbox" id="sport-basquetbol"><span>Básquetbol</span></label></div>
        </fieldset>
        <label class="campo" for="title">Título<input id="title" maxlength="120" required></label>
        <label class="campo" for="summary">Resumen<textarea id="summary" rows="2" maxlength="240" required></textarea></label>
        <label class="campo" for="content">Texto completo<textarea id="content" rows="8" maxlength="5000" required></textarea></label>
        <div class="campos">
          <div class="campo">Imagen
            <img id="imagePreview" class="vista-imagen ancha" alt="Vista previa" hidden>
            <small>Sube una imagen o pega una URL que empiece con https.</small>
          </div>
          <div class="campos" style="grid-template-columns:1fr">
            <label class="campo" for="imageFile">Subir imagen<input id="imageFile" type="file" accept="image/*"></label>
            <label class="campo" for="imageUrl">O pegar URL<input id="imageUrl" type="url" inputmode="url" placeholder="https://"></label>
            <button class="boton boton-borde boton-chico" type="button" id="imageClear">Quitar imagen</button>
          </div>
        </div>
        <label class="interruptor"><input type="checkbox" id="featured" checked><span>Destacar en En vivo</span></label>
        <div class="acciones-form">
          <button class="boton boton-rojo" type="submit" id="submitBtn">Publicar noticia</button>
          <p class="aviso" id="formNote" role="status" aria-live="polite"></p>
        </div>
      </form>
      <section class="seccion" aria-labelledby="t-lista">
        <div class="lista-cabeza"><h2 id="t-lista">Noticias publicadas</h2><div id="listFilter" hidden></div></div>
        <div class="lista" id="itemsList"></div>
      </section>
    </main>
  </div>
  <script type="module" src="../assets/js/shell.js?v=20261103d"></script>
  <script type="module" src="../assets/js/admin/news-admin.js?v=20261103d"></script>
</body>
</html>
