<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar | Panel Mineros TV</title>
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#19191B" media="(prefers-color-scheme: dark)">
  <script>try{var p=JSON.parse(localStorage.getItem("mineros_prefs")||"{}");if(p.theme==="light"||p.theme==="dark")document.documentElement.dataset.theme=p.theme;if(p.text==="grande"||p.text==="enorme")document.documentElement.dataset.text=p.text;}catch(e){}</script>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Big+Shoulders+Display:wght@600;800;900&family=Big+Shoulders+Stencil+Display:wght@800&display=swap">
  <link rel="stylesheet" href="../assets/css/main.css?v=20261103d">
  <link rel="stylesheet" href="../assets/css/admin.css?v=20261103d">
</head>
<body>
  <main class="acceso">
    <form class="formulario tarjeta" id="loginForm">
      <a class="marca" href="../index.html"><img src="../assets/icons/escudo.png" alt="" width="48" height="34">Mineros<span>TV</span></a>
      <h1>Panel de administración</h1>
      <label class="campo" for="email">Correo<input id="email" type="email" required autocomplete="email"></label>
      <label class="campo" for="password">Contraseña<input id="password" type="password" required autocomplete="current-password"></label>
      <button class="boton boton-rojo boton-ancho" type="submit">Entrar</button>
      <p class="aviso error" id="authNote" role="alert"></p>
      <a class="boton-texto" href="../index.html">Volver a la app</a>
    </form>
  </main>
  <script type="module" src="../assets/js/admin/auth.js?v=20261103d"></script>
</body>
</html>
