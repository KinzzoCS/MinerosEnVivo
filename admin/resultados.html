<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Resultados | Panel Mineros TV</title>
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#19191B" media="(prefers-color-scheme: dark)">
  <script>try{var p=JSON.parse(localStorage.getItem("mineros_prefs")||"{}");if(p.theme==="light"||p.theme==="dark")document.documentElement.dataset.theme=p.theme;if(p.text==="grande"||p.text==="enorme")document.documentElement.dataset.text=p.text;}catch(e){}</script>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Big+Shoulders+Display:wght@600;800;900&family=Big+Shoulders+Stencil+Display:wght@800&display=swap">
  <link rel="stylesheet" href="../assets/css/main.css?v=20261103d">
  <link rel="stylesheet" href="../assets/css/admin.css?v=20261103d">
</head>
<body class="cargando">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div class="panel">
    <header class="panel-cabeza">
      <a class="marca" href="dashboard.html"><img src="../assets/icons/escudo.png" alt="" width="48" height="34">Panel<span>MTV</span></a>
      <span class="panel-usuario" data-admin-email></span>
      <button class="boton-ajustes" type="button" data-abrir-ajustes aria-label="Ajustes de letra y color">Aa</button>
      <button class="boton boton-borde boton-chico" type="button" data-logout>Salir</button>
    </header>
    <nav class="panel-nav" data-admin-nav aria-label="Secciones del panel"></nav>
    <main class="panel-main" id="contenido">
      <div class="panel-titulo">
        <h1>Resultados</h1>
        <p>Marcadores finales. Los de béisbol que se guardan desde la pizarra traen la línea por entrada.</p>
      </div>
      <form class="formulario tarjeta" id="resultForm">
        <input type="hidden" id="resultDocId">
        <fieldset class="grupo" data-campo-deporte>
          <legend>Deporte</legend>
          <div class="opciones opciones-2"><label><input type="radio" name="sport" value="beisbol" checked><span>Béisbol</span></label><label><input type="radio" name="sport" value="basquetbol"><span>Básquetbol</span></label></div>
        </fieldset>
        <div class="campos">
          <label class="campo" for="away">Equipo visitante<input id="away" maxlength="40" required></label>
          <label class="campo" for="home">Equipo local<input id="home" maxlength="40" required></label>
        </div>
        <div class="campos">
          <label class="campo" for="resultDate">Fecha del juego<input id="resultDate" type="date" required></label>
          <label class="campo" for="seasonId">Temporada<select id="seasonId"></select><small>Se administran en Campeonatos.</small></label>
        </div>
        <div class="campos" id="camposBeisbol">
          <label class="campo" for="awayScore">Carreras del visitante<input id="awayScore" type="number" inputmode="numeric" min="0" max="99"></label>
          <label class="campo" for="homeScore">Carreras del local<input id="homeScore" type="number" inputmode="numeric" min="0" max="99"></label>
        </div>
        <div id="camposBasquet" hidden>
          <p class="tenue">Puntos por cuarto. El total se calcula solo.</p>
          <div class="captura-cuartos" id="cuartos"></div>
          <div class="acciones-form">
            <button class="boton boton-borde boton-chico" type="button" id="addOvertime">Agregar tiempo extra</button>
            <button class="boton boton-borde boton-chico" type="button" id="removeOvertime" hidden>Quitar tiempo extra</button>
          </div>
        </div>
        <div class="acciones-form">
          <button class="boton boton-rojo" type="submit" id="submitBtn">Guardar resultado</button>
          <p class="aviso" id="formNote" role="status" aria-live="polite"></p>
        </div>
      </form>
      <section class="seccion" aria-labelledby="t-lista">
        <div class="lista-cabeza"><h2 id="t-lista">Resultados</h2><div id="listFilter" hidden></div></div>
        <div class="lista" id="resultsList"></div>
      </section>
    </main>
  </div>
  <script type="module" src="../assets/js/shell.js?v=20261103d"></script>
  <script type="module" src="../assets/js/admin/results-admin.js?v=20261103d"></script>
</body>
</html>
